services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./backend/deckguru.db:/app/deckguru.db
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - CHROMA_PATH=/data/rag/vectorstore/chroma
      - SQLITE_PATH=/app/deckguru.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
